# GoReleaser builds and publishes every Bifrost release.
version: 2

project_name: bifrost

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bifrost
    main: ./cmd/bifrost
    binary: bifrost

    env:
      - CGO_ENABLED=0

    flags:
      - -trimpath

    ldflags:
      - >-
        -s -w
        -X github.com/FullFran/bifrost/internal/buildinfo.version={{ .Version }}
        -X github.com/FullFran/bifrost/internal/buildinfo.commit={{ .ShortCommit }}
        -X github.com/FullFran/bifrost/internal/buildinfo.date={{ .Date }}

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - bifrost

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^refactor(\(.+\))?:'
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
